spec:
  containers:
  - name: people360
    image: /sc360_app_provider/images/repo/people_360:latest
    env:
      PORT: "8080"
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m
    readinessProbe:
      port: 8080
      path: /healthcheck
  endpoints:
  - name: people360
    port: 8080
    public: true
serviceRoles:
- name: people_360_role
  endpoints:
  - people360
